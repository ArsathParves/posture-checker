# T8/T9 — CI gate. The offline test suite is the merge gate; the network
# suite runs nightly on schedule so live-DNS flakiness never blocks a PR
# but regressions against ground-truth domains are still caught within
# 24h.
#
# Pin the offline suite as required-status-check on the main branch in
# repo settings (Settings → Branches → Branch protection rules) so the
# gate is enforced, not merely advisory.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run the network suite nightly at 03:17 UTC. Odd minute avoids
    # colliding with the top-of-hour scheduling stampede on GitHub's
    # shared runners.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a new commit lands —
# no point burning minutes on stale commits when we're about to test
# the newer HEAD.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline:
    name: offline (${{ matrix.python }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        # Pin the CP3 floor (3.10) and the current stable. Skipping the
        # in-between minors keeps CI minutes reasonable while still
        # catching pure-Python compat regressions at either end of the
        # supported range.
        python: ["3.10", "3.12"]
        os: [ubuntu-latest]
        include:
          # One macOS run on the current stable to catch platform-
          # specific breakage in dnspython / cryptography wheels.
          - python: "3.12"
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[web,dev]
      - name: Offline test suite
        # `-m "not network"` is the CI gate per T9. Any test that needs
        # outbound DNS/HTTPS must be decorated `@pytest.mark.network` so
        # it opts OUT of the merge-blocking run.
        run: pytest -m "not network" -ra

  network:
    name: network (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[web,dev]
      - name: Network test suite
        # Only the network-marked tests. A failure here does NOT block
        # PRs (this job runs on schedule) but a persistent failure is a
        # signal that live-DNS ground truth has drifted from what the
        # tool expects — investigate before dismissing.
        run: pytest -m "network" -ra
